<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İNADİNA TV - Spor Paneli</title>
    <!-- Hls.js Kütüphanesi (m3u8 desteği için) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff2d7a;
            --neon-purple: #9b4dff;
            --neon-cyan: #00eaff;
            --neon-gold: #ffcc33;
            --bg-dark: #05050b;
            --bg-card: rgba(12, 10, 24, 0.85);
            --text-main: #f4efff;
            --text-muted: #8d84aa;
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --glow-pink: 0 0 30px rgba(255, 45, 122, 0.5), 0 0 60px rgba(255, 45, 122, 0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Barlow', sans-serif; color: var(--text-main);
            min-height: 100vh; background: var(--bg-dark); overflow-x: hidden;
            background-image: radial-gradient(ellipse at 20% 20%, rgba(255,45,122,0.06) 0%, transparent 55%), radial-gradient(ellipse at 80% 60%, rgba(155,77,255,0.07) 0%, transparent 55%);
            background-attachment: fixed;
        }

        .wrapper { width: min(1380px, calc(100% - 32px)); margin: 0 auto; padding: 22px 0; position: relative; z-index: 1; }

        .site-header {
            display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; margin-bottom: 22px;
            background: rgba(12,10,24,0.9); border: 1px solid rgba(255,45,122,0.35);
            border-radius: var(--radius-xl); backdrop-filter: blur(16px); box-shadow: var(--glow-pink);
        }

        .logo-main {
            font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 5px;
            background: linear-gradient(135deg, #ff2d7a 0%, #9b4dff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .main-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; margin-bottom: 20px; }

        .player-wrap {
            position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 30px; overflow: hidden;
            border: 2px solid rgba(255,45,122,0.4); box-shadow: var(--glow-pink);
        }
        /* Hem iframe hem video için ortak stil */
        #liveIframe, #liveVideo {
            width: 100%; height: 100%; border: 0; display: none; background: #000;
        }

        .side-panel { display: flex; flex-direction: column; gap: 16px; }

        .now-playing-card {
            background: rgba(255,45,122,0.08); border: 1px solid rgba(255,45,122,0.4);
            border-radius: var(--radius-lg); padding: 20px 16px; text-align: center; backdrop-filter: blur(10px);
        }

        .channel-selector-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 10px 0; }
        .nav-btn {
            width: 42px; height: 42px; border-radius: 50%; background: rgba(255,45,122,0.18);
            border: 2px solid rgba(255,45,122,0.6); color: #fff; cursor: pointer;
        }

        .now-channel { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--neon-pink); min-width: 130px; }

        .channels-section {
            background: rgba(12,10,24,0.9); border: 1px solid rgba(255,45,122,0.25);
            border-radius: 28px; padding: 24px;
        }
        .channel-row { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 10px; }
        .ch-btn {
            flex: 0 0 auto; min-width: 120px; padding: 15px; border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.1); background: #1a152e; color: white; cursor: pointer;
        }
        .ch-btn.active { border-color: var(--neon-pink); background: rgba(255,45,122,0.2); }
        .ch-number { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--neon-gold); }

        @media (max-width: 1024px) { .main-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="wrapper">
        <header class="site-header">
            <div class="logo-main">İNADİNA TV</div>
            <div style="color: var(--neon-cyan); font-weight: bold;">CANLI YAYIN</div>
        </header>

        <div class="main-layout">
            <div class="player-wrap" id="playerContainer">
                <!-- m3u8 linkleri için video etiketi -->
                <video id="liveVideo" controls playsinline autoplay></video>
                <!-- Web sayfaları için iframe -->
                <iframe id="liveIframe" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>

            <div class="side-panel">
                <div class="now-playing-card">
                    <div style="font-size: 0.7rem; color: var(--text-muted);">ŞU AN İZLENİYOR</div>
                    <div class="channel-selector-row">
                        <button class="nav-btn" onclick="prevChannel()">◀</button>
                        <div class="now-channel" id="nowChannel">-</div>
                        <button class="nav-btn" onclick="nextChannel()">▶</button>
                    </div>
                    <span id="nowQuality" style="background: var(--neon-gold); color: #000; padding: 2px 8px; border-radius: 5px; font-weight: bold;">HD</span>
                </div>
            </div>
        </div>

        <div class="channels-section">
            <div style="margin-bottom: 15px; color: var(--text-muted);">KANAL LİSTESİ</div>
            <div class="channel-row" id="channelRow"></div>
        </div>
    </div>

    <script>
        /* Kanal Verileri */
        const streamLinks = [
            "http://sewv654wfcsdwfi87fwvgbngh.siauliairsavlt.pw/iptv/MVTMCC4UTAZVDT/6817/index.m3u8",
            "http://sewv654wfcsdwfi87fwvgbngh.siauliairsavlt.pw/iptv/MVTMCC4UTAZVDT/6818/index.m3u8",
            "http://sewv654wfcsdwfi87fwvgbngh.siauliairsavlt.pw/iptv/MVTMCC4UTAZVDT/6821/index.m3u8",
            "https://l24.im/2Kd8", 
            "https://diestv3.com/channel?id=zirve"
        ];
        const channelNames = ["Beinsports 1", "Beinsports 2", "Beinsports 3", "Kanal 1", "Zirve TV"];
        const qualityLabels = ["ULTRA", "ULTRA", "ULTRA", "HD", "HD"];

        let currentIndex = 0;
        let hls = null;

        const video = document.getElementById("liveVideo");
        const iframe = document.getElementById("liveIframe");

        function buildButtons() {
            const container = document.getElementById("channelRow");
            streamLinks.forEach((url, i) => {
                const btn = document.createElement("button");
                btn.className = "ch-btn" + (i === 0 ? " active" : "");
                btn.innerHTML = `<div class="ch-number">${i + 1}</div><div style="font-size:0.7rem">${channelNames[i]}</div>`;
                btn.onclick = () => switchChannel(i);
                container.appendChild(btn);
            });
            switchChannel(0);
        }

        function switchChannel(index) {
            currentIndex = index;
            const url = streamLinks[index];
            
            // UI Güncelleme
            document.getElementById("nowChannel").textContent = channelNames[index];
            document.getElementById("nowQuality").textContent = qualityLabels[index];
            document.querySelectorAll(".ch-btn").forEach((b, i) => b.classList.toggle("active", i === index));

            // Önceki HLS akışını durdur
            if (hls) {
                hls.destroy();
                hls = null;
            }

            // Link Türünü Kontrol Et (.m3u8 mi yoksa normal sayfa mı?)
            if (url.includes(".m3u8") || url.includes(".ts")) {
                iframe.style.display = "none";
                iframe.src = "";
                video.style.display = "block";

                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play();
                    });
                } 
                else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // Safari desteği için
                    video.src = url;
                    video.play();
                }
            } else {
                // Normal Web Sayfası ise (iframe)
                video.pause();
                video.style.display = "none";
                iframe.style.display = "block";
                iframe.src = url;
            }
        }

        function nextChannel() { switchChannel((currentIndex + 1) % streamLinks.length); }
        function prevChannel() { switchChannel((currentIndex - 1 + streamLinks.length) % streamLinks.length); }

        window.onload = buildButtons;
    </script>
</body>
</html>
