<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İNADİNA TV - Canlı Spor & Maç İzleme Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff2d7a;
            --neon-pink-glow: rgba(255, 45, 122, 0.4);
            --neon-purple: #9b4dff;
            --neon-purple-glow: rgba(155, 77, 255, 0.4);
            --neon-cyan: #00eaff;
            --neon-cyan-glow: rgba(0, 234, 255, 0.4);
            --neon-gold: #ffcc33;
            --neon-green: #00ff88;
            --bg-dark: #06050e;
            --bg-card: rgba(15, 12, 30, 0.85);
            --bg-card-hover: rgba(25, 20, 48, 0.9);
            --text-main: #f4efff;
            --text-muted: #9e93bc;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --glow-pink: 0 0 30px rgba(255, 45, 122, 0.4), 0 0 60px rgba(255, 45, 122, 0.15);
            --glow-purple: 0 0 30px rgba(155, 77, 255, 0.4), 0 0 60px rgba(155, 77, 255, 0.15);
            --glow-cyan: 0 0 25px rgba(0, 234, 255, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Barlow', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            background: var(--bg-dark);
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 20% 15%, rgba(255,45,122,0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 50%, rgba(155,77,255,0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 85%, rgba(0,234,255,0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 10% 80%, rgba(255,204,51,0.04) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .bg-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; opacity: 0; }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        .wrapper { width: min(1440px, calc(100% - 32px)); margin: 0 auto; padding: 20px 0; position: relative; z-index: 1; }

        /* Site Header */
        .site-header {
            display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; margin-bottom: 20px;
            background: rgba(12,10,26,0.92); border: 1px solid rgba(255,45,122,0.35);
            border-radius: var(--radius-xl); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--glow-pink); position: relative; overflow: hidden; flex-wrap: wrap; gap: 14px;
        }
        .site-header::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,45,122,0.06), transparent, rgba(155,77,255,0.06), transparent);
            animation: headerRotate 10s linear infinite; pointer-events: none;
        }
        @keyframes headerRotate { to { transform: rotate(360deg); } }

        .brand-area { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
        .logo-main {
            font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 4px;
            background: linear-gradient(135deg, #ff2d7a 0%, #ff6bac 30%, #9b4dff 60%, #00eaff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            filter: drop-shadow(0 0 18px rgba(255,45,122,0.5));
            animation: logoPulse 3s ease-in-out infinite; line-height: 1;
        }
        @keyframes logoPulse {
            0%, 100% { filter: drop-shadow(0 0 18px rgba(255,45,122,0.5)); }
            50% { filter: drop-shadow(0 0 30px rgba(255,45,122,0.8)) drop-shadow(0 0 45px rgba(155,77,255,0.6)); }
        }

        .header-meta { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; flex-wrap: wrap; }
        .domain-tag {
            background: rgba(0,234,255,0.1); border: 1px solid rgba(0,234,255,0.4);
            color: var(--neon-cyan); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700;
            display: flex; align-items: center; gap: 8px; box-shadow: 0 0 15px rgba(0,234,255,0.2);
        }
        .domain-tag .dot { width: 8px; height: 8px; background: var(--neon-cyan); border-radius: 50%; box-shadow: 0 0 10px var(--neon-cyan); }
        
        .live-badge {
            color: #ff3366; font-weight: 900; letter-spacing: 2px; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px; background: rgba(255,45,122,0.12);
            padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,45,122,0.4);
        }
        .live-dot {
            width: 10px; height: 10px; background: #ff2d2d; border-radius: 50%; display: inline-block;
            box-shadow: 0 0 12px #ff2d2d, 0 0 25px #ff2d2d; animation: dotPulse 1.2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%, 100% { box-shadow: 0 0 12px #ff2d2d, 0 0 25px #ff2d2d; transform: scale(1); }
            50% { box-shadow: 0 0 22px #ff2d2d, 0 0 40px #ff2d2d; transform: scale(1.15); }
        }

        .search-box {
            position: relative; min-width: 240px; z-index: 1;
        }
        .search-input {
            width: 100%; background: rgba(20, 16, 40, 0.8); border: 1px solid rgba(155,77,255,0.3);
            border-radius: 20px; padding: 8px 16px 8px 38px; color: #fff; font-size: 0.85rem;
            outline: none; transition: all 0.3s ease;
        }
        .search-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,234,255,0.3); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; opacity: 0.6; }

        /* Main Player Section */
        .main-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; margin-bottom: 24px; }

        .player-container {
            background: rgba(10,8,22,0.95); border-radius: 24px; overflow: hidden;
            border: 2px solid rgba(255,45,122,0.35); box-shadow: var(--glow-pink);
            display: flex; flex-direction: column; position: relative;
        }
        .player-top-bar {
            display: flex; align-items: center; justify-content: space-between; padding: 12px 20px;
            background: rgba(18,14,36,0.9); border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .player-title-info { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1rem; color: #fff; }
        .player-actions { display: flex; align-items: center; gap: 8px; }
        .ctrl-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; padding: 5px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; transition: all 0.25s ease; outline: none;
        }
        .ctrl-btn:hover { background: rgba(255,45,122,0.3); border-color: var(--neon-pink); box-shadow: 0 0 12px rgba(255,45,122,0.4); }

        .player-wrap {
            position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; width: 100%;
        }
        .player-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
        .player-loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,4,12,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            z-index: 5; transition: opacity 0.3s ease; opacity: 0; pointer-events: none;
        }
        .player-loading.active { opacity: 1; pointer-events: auto; }
        .spinner { width: 44px; height: 44px; border: 4px solid rgba(255,45,122,0.2); border-top-color: var(--neon-pink); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Side Panel */
        .side-panel { display: flex; flex-direction: column; gap: 16px; }

        .now-playing-card {
            background: rgba(255,45,122,0.08); border: 1px solid rgba(255,45,122,0.35);
            border-radius: var(--radius-lg); padding: 20px 16px 16px; text-align: center;
            backdrop-filter: blur(10px); box-shadow: var(--glow-pink); position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }
        .now-label { font-size: 0.7rem; letter-spacing: 4px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; z-index: 1; }

        .channel-selector-row {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            margin: 12px 0 10px; z-index: 2; position: relative; width: 100%;
        }

        .nav-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,45,122,0.18); border: 2px solid rgba(255,45,122,0.6);
            color: #fff; font-size: 1.3rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.25s ease; outline: none; box-shadow: 0 0 12px rgba(255,45,122,0.3); flex-shrink: 0;
        }
        .nav-btn:hover { background: rgba(255,45,122,0.4); border-color: var(--neon-pink); box-shadow: 0 0 25px rgba(255,45,122,0.7); transform: scale(1.08); }

        .now-channel {
            font-family: 'Bebas Neue', sans-serif; font-size: 2.1rem; color: var(--neon-pink);
            text-shadow: 0 0 20px rgba(255,45,122,0.5); letter-spacing: 2px;
            min-width: 140px; text-align: center; line-height: 1.1;
        }

        .now-quality-badge {
            display: inline-block; background: linear-gradient(135deg, #ffcc33, #ffa800); color: #000;
            padding: 4px 14px; border-radius: 12px; font-weight: 900; font-size: 0.8rem; letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255,204,51,0.4);
        }

        .quick-stats-card {
            background: rgba(12,10,26,0.85); border: 1px solid rgba(155,77,255,0.3);
            border-radius: var(--radius-lg); padding: 18px 20px; backdrop-filter: blur(10px);
            box-shadow: var(--glow-purple); display: flex; flex-direction: column; gap: 14px;
        }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
        .stat-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); padding: 10px; border-radius: 14px; }
        .stat-title { font-size: 0.65rem; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .stat-val { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 1.6rem; color: var(--neon-purple); text-shadow: 0 0 12px rgba(155,77,255,0.5); }

        .gamepad-indicator {
            font-size: 0.8rem; color: #b794f4; display: flex; align-items: center; justify-content: center; gap: 8px;
            background: rgba(155,77,255,0.1); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(155,77,255,0.25);
        }
        .gamepad-dot { width: 8px; height: 8px; background: #9b4dff; border-radius: 50%; box-shadow: 0 0 10px #9b4dff; }
        .gamepad-dot.inactive { background: #555; box-shadow: none; }

        /* Categorized System / Tabs Section */
        .system-section {
            background: rgba(12,10,26,0.92); border: 1px solid rgba(255,45,122,0.25);
            border-radius: 26px; padding: 24px 22px; backdrop-filter: blur(14px);
            box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 60px rgba(255,45,122,0.08); position: relative; z-index: 1;
        }

        /* Navigation Tabs */
        .tabs-header {
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 14px; flex-wrap: wrap;
        }
        .tabs-list { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .tab-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted); font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
            font-size: 1.1rem; letter-spacing: 1.5px; padding: 10px 22px; border-radius: 16px;
            cursor: pointer; transition: all 0.3s ease; outline: none; display: flex; align-items: center; gap: 8px;
        }
        .tab-btn:hover { background: rgba(255,45,122,0.15); color: #fff; border-color: rgba(255,45,122,0.4); }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(255,45,122,0.3) 0%, rgba(155,77,255,0.3) 100%);
            border-color: var(--neon-pink); color: #fff; box-shadow: var(--glow-pink);
        }
        .tab-badge { background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; font-weight: 800; color: var(--neon-gold); }
        .tab-btn.active .tab-badge { background: var(--neon-pink); color: #fff; }

        /* Filter Pills */
        .filter-row { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 14px; margin-bottom: 16px; scrollbar-width: none; }
        .filter-row::-webkit-scrollbar { display: none; }
        .filter-pill {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            color: #aaa; padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
            cursor: pointer; transition: all 0.25s ease; white-space: nowrap; outline: none;
        }
        .filter-pill:hover { background: rgba(0,234,255,0.1); color: #fff; border-color: rgba(0,234,255,0.3); }
        .filter-pill.active { background: rgba(0,234,255,0.2); color: var(--neon-cyan); border-color: var(--neon-cyan); box-shadow: 0 0 12px rgba(0,234,255,0.3); }

        /* Grid Layouts */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* Channel Carousel Grid */
        .channel-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 14px;
        }
        .ch-btn {
            padding: 16px 12px; border-radius: 18px; border: 1.5px solid rgba(255,255,255,0.08);
            background: linear-gradient(180deg, rgba(25,18,45,0.9) 0%, rgba(12,8,25,0.95) 100%);
            color: white; cursor: pointer; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            text-align: center; position: relative; overflow: hidden; outline: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        }
        .ch-btn:hover {
            border-color: rgba(255,45,122,0.6); transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 25px rgba(255,45,122,0.25);
            background: linear-gradient(180deg, rgba(35,22,55,0.95) 0%, rgba(18,10,35,0.98) 100%);
        }
        .ch-btn.active {
            border-color: var(--neon-pink)!important;
            background: linear-gradient(180deg, rgba(255,45,122,0.25) 0%, rgba(155,77,255,0.2) 100%)!important;
            box-shadow: 0 0 30px rgba(255,45,122,0.5), 0 6px 20px rgba(0,0,0,0.5)!important;
            transform: translateY(-2px);
        }
        .ch-icon { font-size: 1.5rem; margin-bottom: 2px; }
        .ch-number { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--neon-gold); line-height: 1; }
        .ch-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #ddd; }

        /* Match Cards Grid */
        .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }

        .match-card {
            background: linear-gradient(135deg, rgba(20,16,42,0.9) 0%, rgba(12,9,26,0.95) 100%);
            border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-lg); padding: 16px;
            display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden;
            transition: all 0.3s ease;
        }
        .match-card:hover {
            border-color: rgba(0,234,255,0.5); transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 25px rgba(0,234,255,0.15);
        }
        .match-card.is-live { border-color: rgba(255,45,122,0.4); }
        .match-card.is-live:hover { border-color: var(--neon-pink); box-shadow: 0 10px 30px rgba(0,0,0,0.6), var(--glow-pink); }

        .match-header { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); }
        .match-league { display: flex; align-items: center; gap: 6px; color: var(--neon-cyan); }
        .match-status-tag {
            background: rgba(255,45,122,0.15); color: var(--neon-pink); border: 1px solid rgba(255,45,122,0.4);
            padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 800; display: flex; align-items: center; gap: 6px;
        }
        .match-status-tag.daily { background: rgba(255,204,51,0.12); color: var(--neon-gold); border-color: rgba(255,204,51,0.3); }

        .match-teams {
            font-family: 'Barlow Condensed', sans-serif; font-size: 1.35rem; font-weight: 700;
            color: #fff; text-align: center; margin: 4px 0; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .match-score { background: rgba(255,45,122,0.2); color: #fff; padding: 2px 10px; border-radius: 8px; font-size: 1.2rem; font-weight: 900; }

        .match-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px; margin-top: 4px; }
        .match-channel-name { font-size: 0.8rem; font-weight: 600; color: #aaa; display: flex; align-items: center; gap: 6px; }

        .play-match-btn {
            background: linear-gradient(135deg, var(--neon-pink) 0%, var(--neon-purple) 100%);
            color: #fff; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 800;
            font-size: 0.82rem; cursor: pointer; transition: all 0.25s ease; outline: none;
            box-shadow: 0 0 15px rgba(255,45,122,0.3); display: flex; align-items: center; gap: 6px;
        }
        .play-match-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255,45,122,0.6); }

        .empty-msg { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 1rem; }

        /* Responsive Breakpoints */
        @media (max-width: 1024px) {
            .main-layout { grid-template-columns: 1fr; }
            .side-panel { flex-direction: row; flex-wrap: wrap; }
            .now-playing-card { flex: 1 1 220px; }
            .quick-stats-card { flex: 1 1 200px; }
        }

        @media (max-width: 600px) {
            .wrapper { width: calc(100% - 16px); padding: 10px 0; }
            .site-header { padding: 12px 16px; border-radius: 18px; flex-direction: column; align-items: flex-start; }
            .logo-main { font-size: 2.2rem; }
            .search-box { width: 100%; }
            .match-grid { grid-template-columns: 1fr; }
            .tab-btn { font-size: 0.95rem; padding: 8px 14px; }
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="bgParticles"></div>

    <div class="wrapper">
        <!-- Site Header -->
        <header class="site-header">
            <div class="brand-area">
                <div class="logo-main">İNADİNA TV</div>
                <div class="live-badge"><span class="live-dot"></span> CANLI YAYIN</div>
            </div>

            <div class="header-meta">
                <div class="domain-tag" id="domainTag">
                    <span class="dot"></span>
                    <span id="domainText">Sunucu: fixbettv84.com</span>
                </div>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Kanal veya Maç Ara..." />
                </div>
            </div>
        </header>

        <!-- Main Video & Side Control Panel -->
        <div class="main-layout">
            <div class="player-container">
                <div class="player-top-bar">
                    <div class="player-title-info">
                        <span id="playerIcon">⚽</span>
                        <span id="playerTitle">BEIN SPORTS 1 HD</span>
                    </div>
                    <div class="player-actions">
                        <button class="ctrl-btn" id="reloadPlayerBtn" title="Yayn Yenile">🔄 Yenile</button>
                        <button class="ctrl-btn" id="fullscreenBtn" title="Tam Ekran">⛶ Tam Ekran</button>
                    </div>
                </div>

                <div class="player-wrap" id="playerWrap">
                    <div class="player-loading" id="playerLoading">
                        <div class="spinner"></div>
                        <div style="font-weight:700; color:var(--neon-pink);">Yayın Yükleniyor...</div>
                    </div>
                    <iframe id="liveIframe" src="" allowfullscreen allow="autoplay; encrypted-media" loading="lazy"></iframe>
                </div>
            </div>

            <div class="side-panel">
                <div class="now-playing-card">
                    <div class="now-label">📡 İZLENEN KANAL</div>
                    <div class="channel-selector-row">
                        <button class="nav-btn" id="navPrev" title="Önceki Kanal" aria-label="Önceki kanal">◀</button>
                        <div class="now-channel" id="nowChannel">-</div>
                        <button class="nav-btn" id="navNext" title="Sonraki Kanal" aria-label="Sonraki kanal">▶</button>
                    </div>
                    <span class="now-quality-badge" id="nowQuality">4K HD</span>
                </div>

                <div class="quick-stats-card">
                    <div class="stat-grid">
                        <div class="stat-box">
                            <div class="stat-title">📺 KANALLAR</div>
                            <div class="stat-val" id="totalChannelsCount">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-title">🔴 CANLI MAÇLAR</div>
                            <div class="stat-val" id="totalLiveCount" style="color:var(--neon-pink);">0</div>
                        </div>
                    </div>

                    <div class="gamepad-indicator" id="gamepadStatus">
                        <span class="gamepad-dot inactive" id="gamepadDot"></span>

        const navNext = document.getElementById("navNext");

        const domainText = document.getElementById("domainText");

        const channelGrid = document.getElementById("channelGrid");
        const liveMatchesGrid = document.getElementById("liveMatchesGrid");
        const dailyMatchesGrid = document.getElementById("dailyMatchesGrid");

        let currentIndex = 0;
        let activeFilter = "all";
        let activeTab = "channelsTab";

        const channelIcons = channelNames.map(name => {
            if (name.includes('BEIN')) return '⚽';
            if (name.includes('S SPOR')) return '🏀';
            if (name.includes('EURO')) return '🚴';
            if (name.includes('TRT')) return '🇹🇷';
            if (name.includes('TABİİ')) return '📡';
            if (name.includes('TİVİBU')) return '📡';
            if (name.includes('SMART')) return '🧠';
            if (name.includes('A SPOR')) return '⚽';
            if (name.includes('ATV') || name.includes('TV 8')) return '📺';
            return '📺';
        });

        function initData() {
            if (typeof activeDomain !== 'undefined' && activeDomain) {
                domainText.textContent = "Sunucu: " + activeDomain;
            }

            totalChannelsCount.textContent = streamLinks.length;
            totalLiveCount.textContent = liveMatchesData.length;

            badgeChannels.textContent = streamLinks.length;
            badgeLive.textContent = liveMatchesData.length;
            badgeDaily.textContent = dailyMatchesData.length;

            renderChannels();
            renderLiveMatches();
            renderDailyMatches();

            if (streamLinks.length > 0) {
                switchChannel(0);
            }
        }

        function switchChannel(index) {
            if (index < 0 || index >= streamLinks.length) return;
            currentIndex = index;

            playerLoading.classList.add("active");
            iframe.src = streamLinks[index];

            setTimeout(() => { playerLoading.classList.remove("active"); }, 600);

            const chName = channelNames[index];
            const chIcon = channelIcons[index] || '📡';
            const quality = qualityLabels[index] || 'HD';

            nowChannel.textContent = chName;
            playerTitle.textContent = chName + " (" + quality + ")";
            playerIcon.textContent = chIcon;
            nowQuality.textContent = quality;

            document.querySelectorAll(".ch-btn").forEach((btn, i) => {
                if (i === index) btn.classList.add("active");
                else btn.classList.remove("active");
            });

            updateNavButtons();
        }

        function loadStreamDirectUrl(url, name, icon, quality) {
            playerLoading.classList.add("active");
            iframe.src = url;
            setTimeout(() => { playerLoading.classList.remove("active"); }, 600);

            nowChannel.textContent = name;
            playerTitle.textContent = name + " (" + (quality || "HD") + ")";
            playerIcon.textContent = icon || "📡";

            document.getElementById("playerWrap").scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function renderChannels() {
            channelGrid.innerHTML = "";
            const searchVal = searchInput.value.toLowerCase().trim();

            streamLinks.forEach((url, i) => {
                const name = channelNames[i];
                if (searchVal && !name.toLowerCase().includes(searchVal)) return;

                const btn = document.createElement("button");
                btn.className = "ch-btn" + (i === currentIndex ? " active" : "");
                let num = (i + 1).toString().padStart(2, '0');

                btn.innerHTML = `
                    <span class="ch-icon">${channelIcons[i] || '📡'}</span>
                    <div class="ch-number">${num}</div>
                    <div class="ch-label">${name}</div>
                `;
                btn.onclick = () => switchChannel(i);
                channelGrid.appendChild(btn);
            });

            if (channelGrid.children.length === 0) {
                channelGrid.innerHTML = `<div class="empty-msg">Aramanıza uygun kanal bulunamadı.</div>`;
            }
        }

        function renderLiveMatches() {
            liveMatchesGrid.innerHTML = "";
            const searchVal = searchInput.value.toLowerCase().trim();

            const filtered = liveMatchesData.filter(m => {
                const matchesSearch = !searchVal || m.title.toLowerCase().includes(searchVal) || m.league.toLowerCase().includes(searchVal);
                const matchesFilter = activeFilter === "all" || m.sport === activeFilter;
                return matchesSearch && matchesFilter;
            });

            filtered.forEach(m => {
                const card = document.createElement("div");
                card.className = "match-card is-live";
                card.innerHTML = `
                    <div class="match-header">
                        <span class="match-league">${m.icon} ${m.league}</span>
                        <span class="match-status-tag"><span class="live-dot"></span> CANLI ${m.time}</span>
                    </div>
                    <div class="match-teams">
                        <span>${m.title}</span>
                    </div>
                    <div style="text-align:center;"><span class="match-score">${m.score}</span></div>
                    <div class="match-footer">
                        <span class="match-channel-name">📡 ${m.channelName}</span>
                        <button class="play-match-btn" onclick="loadStreamDirectUrl('${m.streamUrl}', '${m.title.replace(/'/g, "\\'")}', '${m.icon}', 'CANLI HD')">
                            ▶ MAÇI İZLE
                        </button>
                    </div>
                `;
                liveMatchesGrid.appendChild(card);
            });

            if (filtered.length === 0) {
                liveMatchesGrid.innerHTML = `<div class="empty-msg">Seçilen kategoride şu an canlı maç bulunmuyor.</div>`;
            }
        }

        function renderDailyMatches() {
            dailyMatchesGrid.innerHTML = "";
            const searchVal = searchInput.value.toLowerCase().trim();

            const filtered = dailyMatchesData.filter(m => {
                const matchesSearch = !searchVal || m.title.toLowerCase().includes(searchVal) || m.league.toLowerCase().includes(searchVal);
                const matchesFilter = activeFilter === "all" || m.sport === activeFilter;
                return matchesSearch && matchesFilter;
            });

            filtered.forEach(m => {
                const card = document.createElement("div");
                card.className = "match-card";
                card.innerHTML = `
                    <div class="match-header">
                        <span class="match-league">${m.icon} ${m.league}</span>
                        <span class="match-status-tag daily">⏰ ${m.time} | ${m.status}</span>
                    </div>
                    <div class="match-teams">
                        <span>${m.title}</span>
                    </div>
                    <div class="match-footer">
                        <span class="match-channel-name">📡 ${m.channelName}</span>
                        <button class="play-match-btn" onclick="loadStreamDirectUrl('${m.streamUrl}', '${m.title.replace(/'/g, "\\'")}', '${m.icon}', 'HD')">
                            ▶ YAYINA GİT
                        </button>
                    </div>
                `;
                dailyMatchesGrid.appendChild(card);
            });

            if (filtered.length === 0) {
                dailyMatchesGrid.innerHTML = `<div class="empty-msg">Günün maç listesinde eşleşen karşılaşma bulunamadı.</div>`;
            }
        }

        function updateNavButtons() {
            if (streamLinks.length <= 1) {
                navPrev.style.opacity = "0.4"; navNext.style.opacity = "0.4";
            } else {
                navPrev.style.opacity = "1"; navNext.style.opacity = "1";
            }
        }

        // Tab Switching
        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

                btn.classList.add("active");
                activeTab = btn.getAttribute("data-tab");
                document.getElementById(activeTab).classList.add("active");
            };
        });

        // Filter Pills
        document.querySelectorAll(".filter-pill").forEach(pill => {
            pill.onclick = () => {
                document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
                pill.classList.add("active");
                activeFilter = pill.getAttribute("data-filter");
                renderChannels();
                renderLiveMatches();
                renderDailyMatches();
            };
        });

        // Search Input
        searchInput.oninput = () => {
            renderChannels();
            renderLiveMatches();
            renderDailyMatches();
        };

        // Navigation Prev / Next
        navPrev.onclick = () => switchChannel((currentIndex - 1 + streamLinks.length) % streamLinks.length);
        navNext.onclick = () => switchChannel((currentIndex + 1) % streamLinks.length);

        reloadPlayerBtn.onclick = () => {
            const currentSrc = iframe.src;
            iframe.src = "";
            playerLoading.classList.add("active");
            setTimeout(() => {
                iframe.src = currentSrc;
                playerLoading.classList.remove("active");
            }, 300);
        };

        fullscreenBtn.onclick = () => {
            const playerWrap = document.getElementById("playerWrap");
            if (playerWrap.requestFullscreen) playerWrap.requestFullscreen();
            else if (playerWrap.webkitRequestFullscreen) playerWrap.webkitRequestFullscreen();
            else if (playerWrap.msRequestFullscreen) playerWrap.msRequestFullscreen();
        };

        // Keyboard & Gamepad Control
        document.addEventListener("keydown", (e) => {
            const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : "";
            if (tag === "input" || tag === "textarea") return;

            if (e.key === "ArrowRight") { e.preventDefault(); navNext.click(); }
            else if (e.key === "ArrowLeft") { e.preventDefault(); navPrev.click(); }
        });

        // Gamepad Polling
        let gamepadConnected = false;
        function updateGamepadStatus(conn) {
            gamepadConnected = conn;
            const dot = document.getElementById("gamepadDot");
            const txt = document.getElementById("gamepadText");
            if (conn) {
                dot.classList.remove("inactive");
                txt.textContent = "🎮 Kumanda Bağlı";
            } else {
                dot.classList.add("inactive");
                txt.textContent = "Kumanda Bekleniyor";
            }
        }
        window.addEventListener("gamepadconnected", () => updateGamepadStatus(true));
        window.addEventListener("gamepaddisconnected", () => updateGamepadStatus(false));

        // Background Particles
        function createParticles() {
            const container = document.getElementById("bgParticles");
            const colors = ["rgba(255,45,122,0.6)","rgba(155,77,255,0.5)","rgba(0,234,255,0.5)","rgba(255,204,51,0.5)"];
            for (let i = 0; i < 28; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                const sz = Math.random() * 4 + 2;
                p.style.width = sz + "px"; p.style.height = sz + "px";
                p.style.left = Math.random() * 100 + "%";
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.animationDuration = (Math.random() * 10 + 8) + "s";
                p.style.animationDelay = (Math.random() * 8) + "s";
                container.appendChild(p);
            }
        }

        // Initialize App
        document.addEventListener("DOMContentLoaded", () => {
            initData();
            createParticles();
        });
    </script>
