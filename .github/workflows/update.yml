name: Sürekli Güncelleme (5dk)

on:
  schedule:
    - cron: "*/5 * * * *"        # her 5 dakikada bir
  workflow_dispatch: {}          # manuel tetikleme

# Aynı anda tek iş çalışsın
concurrency:
  group: fixbet-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Depot kodunu al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır (site + maçlar + raporlar)
        run: python fixbet.py run

      - name: Değişiklikleri GitHub'a gönder (auto-push)
        run: |
          git config user.name "fixbet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok — push yapılmadı."
          else
            git commit -m "[bot] güncel site + maç raporları ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin HEAD:${{ github.head_ref || 'main' }}
            echo "Güncel adres ve maçlar yüklendi."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
