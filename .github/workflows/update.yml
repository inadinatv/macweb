name: Sürekli Güncelleme (15dk)

on:
  schedule:
    - cron: "2,17,32,47 * * * *"  # ağır tarama; canlı skor ayrı 5 dk işinde
  workflow_dispatch: {}          # manuel tetikleme

# Bütün repo-çıktı yazarları aynı anda tek iş çalıştırsın.
concurrency:
  group: fixbet-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Depot kodunu al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır (site + maçlar + raporlar)
        run: python fixbet.py run

      - name: Değişiklikleri GitHub'a gönder (auto-push)
        run: |
          git config user.name "fixbet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok — push yapılmadı."
          else
            git commit -m "[bot] güncel site + maç raporları ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase origin "${{ github.head_ref || 'main' }}"
            git push origin "HEAD:${{ github.head_ref || 'main' }}"
            echo "Güncel adres ve maçlar yüklendi."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
