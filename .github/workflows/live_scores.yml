name: Canlı Skor (5dk)

# Maç saatlerinde anlık gol + final skoru GitHub'a yazılsın diye hafif bir iş:
# sadece skor API'lerini çağırır, tam site taraması yapmaz.
# İstemci sayfası ayrıca 10 sn'de bir doğrudan ESPN'den tazeler; bot buna ek olarak
# GitHub'ın desteklediği en kısa aralıkla kalıcı snapshot'ı yeniler.

on:
  schedule:
    - cron: "*/5 * * * *"        # GitHub Actions resmi minimum zamanlama aralığı
  workflow_dispatch: {}          # manuel tetikleme

concurrency:
  # Bütün çıktı-yazan workflow'lar aynı kilidi kullanır; push yarışları canlı
  # snapshot'ı non-fast-forward hatasıyla durdurmasın.
  group: fixbet-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depot kodunu al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Sadece skorları tazele (hızlı)
        run: python fixbet.py live-scores

      - name: Değişiklikleri gönder (varsa)
        run: |
          git config user.name "fixbet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Skor değişmedi — push yok."
          else
            git commit -m "[bot] canlı skor ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase origin "${{ github.head_ref || 'main' }}"
            git push origin "HEAD:${{ github.head_ref || 'main' }}"
            echo "Canlı skorlar güncellendi."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
