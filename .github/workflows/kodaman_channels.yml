name: Kodaman kanal ID’leri

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: fixbet-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Herkese açık Kodaman ID’lerini yenile
        run: python fixbet.py kodaman-refresh

      - name: Değişen manifesti gönder
        run: |
          git config user.name "kodaman-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/kodaman_channels.json
          if git diff --cached --quiet; then
            echo "Kodaman ID listesi değişmedi — push yok."
          else
            git commit -m "[bot] Kodaman public kanal ID’leri ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git pull --rebase origin "${GITHUB_HEAD_REF:-main}"
            git push origin "HEAD:${GITHUB_HEAD_REF:-main}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
