name: Günlük Toplu Güncelleme

on:
  schedule:
    - cron: "0 9,18,23 * * *"    # 09:00, 18:00, 23:00 UTC
  workflow_dispatch: {}

concurrency:
  group: fixbet-cron
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Depot kodunu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Uzun izleme + tam güncelleme
        run: |
          python fixbet.py update-site
          python fixbet.py run

      - name: Güncel raporları gönder
        run: |
          git config user.name "fixbet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "[bot] günlük toplu güncelleme ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin HEAD:${GITHUB_HEAD_REF:-main}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
