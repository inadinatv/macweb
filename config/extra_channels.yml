  # --------------------------------------------------------------------------
  #  TARAFTARIUM24 — ana sayfadaki canlı TV kanalları
  #    Kanal bağlantısı /channel/watch/<slug> rotasına SABİTLİDİR
  #    (page_route), örn. https://taraftarium24bedava.com/channel/watch/bein-sports-1.
  #    Sayfadaki kanal linki ve iframe yedeği her zaman bu rota ile biter;
  #    ana sayfadan keşfedilen eski /mac-izle/<slug> bağlantıları yalnızca
  #    m3u8 çıkarımı için yedek olarak denenir, bağlantıya yansıtılmaz.
  #    Alan adı değişirse mevcut ana sayfa yönlendirmesi, giriş adresleri ve
  #    numaralı alan adı aileleri sırayla taranır.
  # --------------------------------------------------------------------------
  - id: taraftarium
    name: "TARAFTARIUM24"
    icon: "📺"
    enabled: true
    base_url: "https://taraftarium24bedava.com"
    entry_urls:
      - "https://taraftarium24bedava.com/"
      - "https://taraftarium24.com/"
      - "https://taraftarium24.xyz/"
    mirror:
      # Birden fazla alan adı ailesi: yeni numaralı ayna önce bulunur.
      patterns:
        - "taraftarium{n}bedava.com"
        - "taraftarium{n}.com"
        - "taraftarium{n}.xyz"
      preferred_number: 24
      scan_window: 12
      # Park/boş alan adlarını elemek için ana sayfadaki kanal kimliği aranır.
      must_contain_any: ["bein-sports-1"]
    health_path: "/"
    # Kanal bağlantısı bu rotaya sabitlenir; link her zaman /channel/watch/<slug> biter.
    page_route: "/channel/watch/"
    # Önce sabit rota denenir; eski /mac-izle rotası yalnızca m3u8 yedeğidir.
    page_templates:
      - "{base_url}/channel/watch/{slug}"
      - "{base_url}/mac-izle/{slug}"
    page_template: "{base_url}/channel/watch/{slug}"
    embed_fallback: true
    referrer: "{base_url}/"
    logo: "{base_url}/assets/img/football_tv1.png"
    channels:
