  - id: mahsun
    name: "MAHSUN SPORTS"
    icon: "🌴"
    enabled: true
    base_url: "https://mahsunsports80.xyz"
    entry_urls:
      - "https://mahsunsports80.xyz/"
      - "https://mahsunsports.xyz/"
      - "https://mahsunsports46.xyz/"
      - "https://mahsunsports13.xyz/"
    mirror:
      pattern: "mahsunsports{n}.xyz"
      preferred_number: 80
      scan_window: 35
      must_contain_any: ["baseurls", "androstream"]
    health_path: "event.html?id=androstreamlivebs1"
    player:
      stream_base_array_pattern: "baseurls\\s*=\\s*\\[(.*?)\\]"
      stream_template: "{stream_base}/checklist/{slug}.m3u8"
      default_stream_base: "https://andro.evrenesoglu99.click"
      verify_static: true
