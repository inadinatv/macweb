# GitHub Actions Workflow Example
# Bu dosyayi GitHub reponuzda .github/workflows/update.yml konumuna ekleyerek otomatik calistirabilirsiniz.

name: Update Live Matches & Stream Domain

on:
  schedule:
    # Her 30 dakikada bir otomatik calisir
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streams:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Botu Calistir
        run: |
          python updater.py

      - name: Degisiklikleri Push Et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/streams.json index.html
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "[BOT] Fixbet TV adres ve canli mac verileri guncellendi"
            git push
          fi
